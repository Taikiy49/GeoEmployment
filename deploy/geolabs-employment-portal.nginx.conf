server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name careers.geolabs.net;

    ssl_certificate /etc/letsencrypt/live/careers.geolabs.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careers.geolabs.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # Two document conversions and email delivery can exceed one minute.
        proxy_read_timeout 360s;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name careers.geolabs.net;
    return 301 https://$host$request_uri;
}
