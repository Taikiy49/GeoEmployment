name: Portal quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROME_PATH: /usr/bin/google-chrome
      TEST_BASE_URL: http://127.0.0.1:4174
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run build
      - run: npm run test:unit
      - name: Browser regressions (isolated test data; no real email)
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
      - name: PDF pagination and content regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice-writer
          LIBREOFFICE_BIN=/usr/bin/libreoffice npm run test:pdf-package
